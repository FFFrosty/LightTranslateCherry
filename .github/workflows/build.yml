name: Windows build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run runtime
      - run: npm run icons
      - run: npm run notices
      - run: npm run typecheck
      - run: npm test
      - run: npm run pack
      - uses: actions/upload-artifact@v4
        with:
          name: LightTranslateCherry-windows-x64
          path: release/win-unpacked
      - run: git archive --format=zip --output=release/LightTranslateCherry-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: LightTranslateCherry-corresponding-source
          path: release/LightTranslateCherry-source.zip
